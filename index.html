    <title>GSIS IBMYP - PrepX</title>
    <meta name="description" content="QR-based Prep Duty attendance tracking system for GSIS IBMYP, Middle School, High School & HSS." />
    
    <!-- PWA & Device Installability Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrepX Attendance" />
    <meta name="application-name" content="PrepX Attendance" />
    <meta name="msapplication-TileColor" content="#1e1b4b" />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar for cleaner UI */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
    </style>
    <script>
      // Early global capture of PWA beforeinstallprompt event so it is never missed
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
        console.log('Global PWA install prompt ready');
      });

      window.addEventListener('appinstalled', function() {
        window.__pwaPrompt = null;
        console.log('GSIS PrepX installed successfully to desktop/device');
      });

      // Immediate Service Worker Registration for Desktop & Mobile Installation
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('Service Worker active for scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('Service Worker registration error:', err);
          });
      }
    </script>
